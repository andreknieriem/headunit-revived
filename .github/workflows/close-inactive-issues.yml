name: "Close Inactive Issues"

on:
  schedule:
    # Runs every day at 01:30 UTC
    - cron: "30 1 * * *"
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          
          # Issues configuration
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity for 30 days. It will be closed in 7 days if no further activity occurs.
            If this issue is still relevant or if you have additional details (such as updated logs),
            please leave a comment.
          close-issue-message: >
            This issue was automatically closed due to inactivity.
            If you are still experiencing this problem, feel free to open a new issue with fresh logs.
          exempt-issue-labels: "pinned,security,feature,enhancement"

          # Pull Requests configuration (disabled by default to avoid accidentally closing PRs)
          days-before-pr-stale: -1
          days-before-pr-close: -1

          # Limit per run to avoid hitting API rate limits
          operations-per-run: 50
